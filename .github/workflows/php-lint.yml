name: PHP lint

# Verification pure, ne publie et ne deploie rien : elle reste donc volontairement sur push de
# branche, conformement a la convention de parc (voir admin/docs/ci-versions-health.md, seuls
# les workflows qui deploient sont limites aux tags et au declenchement manuel).
#
# Pourquoi ce workflow existe : une erreur de syntaxe dans le functions.php d'un theme
# WordPress ne degrade pas une page, elle met TOUT le site en erreur fatale. Le cout d'une
# faute de frappe est donc le site entier, pas un affichage casse. `php -l` parse sans
# executer et sort en erreur : c'est le controle le moins cher qui existe pour ce risque.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: php -l
    # Depot PUBLIC : les minutes GitHub sont gratuites, un runner hebergé suffit et l'image
    # Ubuntu embarque deja PHP. Sur un depot PRIVE il faudrait un runner self-hosted, les
    # minutes y etant facturees.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version de PHP
        run: php --version

      - name: Verifier la syntaxe de tous les fichiers PHP
        # `vendor/` est exclu : ce sont des dependances tierces, pas notre code, et une
        # bibliotheque livree pour une version de PHP differente ferait echouer le lint sans
        # que cela dise quoi que ce soit sur ce depot.
        #
        # `read -d ''` sur un `-print0` plutot qu'une boucle sur les noms : un chemin contenant
        # un espace casserait silencieusement le decoupage et sauterait le fichier.
        #
        # ON NE S'ARRETE PAS A LA PREMIERE ERREUR, et c'est deliberé. Une premiere version
        # utilisait `xargs`, qui abandonne des qu'un fichier echoue : le premier passage sur
        # nopost-theme a signale une erreur puis s'est arrete, laissant croire qu'il n'y en
        # avait qu'une alors que rien ne le garantissait. Un controle qui masque le reste de
        # ce qu'il a trouve oblige a le relancer autant de fois qu'il y a de fautes.
        run: |
          set -uo pipefail
          fichiers=$(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' | wc -l)
          echo "$fichiers fichiers PHP a verifier"
          if [ "$fichiers" -eq 0 ]; then
            echo "Aucun fichier PHP : rien a verifier."
            exit 0
          fi
          echec=0
          while IFS= read -r -d '' f; do
            if ! sortie=$(php -l "$f" 2>&1); then
              echo "::error file=${f#./}::$sortie"
              echec=$((echec + 1))
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0)
          if [ "$echec" -gt 0 ]; then
            echo "$echec fichier(s) en erreur sur $fichiers."
            exit 1
          fi
          echo "Syntaxe valide sur les $fichiers fichiers."
