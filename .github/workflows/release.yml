name: Release

on:
  # Toujours declenchable a la main, filet de securite : permet de rejouer ce
  # workflow sans dependre de son declencheur automatique.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        run: |
          mkdir -p dist build/mworago-ping
          rsync -a --exclude=".git*" --exclude=".github" --exclude="dist" --exclude="build" --exclude="deploy.sh" ./ build/mworago-ping/
          cd build && zip -r ../dist/mworago-ping.zip mworago-ping

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mworago-ping.zip
          generate_release_notes: false
